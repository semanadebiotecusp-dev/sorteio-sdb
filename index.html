<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorteio SdB 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0a1a36;--panel:#102447;--fg:#e8f1ff;--muted:#93acd1;--line:#1e3a6b;--accent:#5aa0ff;--accent-fg:#06142c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Plus Jakarta Sans",system-ui,sans-serif;padding:16px;display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:16px}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.qr{background:#fff;border-radius:14px;padding:14px;display:flex;justify-content:center}
.qr canvas,.qr img{max-width:100%;height:auto}
h1{margin:0;font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.01em}
h1 small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.big{font-size:22px;font-weight:800;line-height:1.15}
.muted{color:var(--muted);font-size:14px;line-height:1.4}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.center{align-items:center;justify-content:center}
.wheelbox{position:relative;width:min(100%,calc(100vh - 190px));aspect-ratio:1}
canvas#cv{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-4px;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid #fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.now{height:1.5em;font-weight:700;font-size:22px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:9px 14px}
button.go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-size:22px;padding:12px 44px;border-radius:999px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.n{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px;font-size:14px;overflow:auto;max-height:100%}
.list{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.list ol{flex:1}
.status{font-size:12px;color:var(--muted)}
.status.err{color:#ffb4a8}
label{display:flex;gap:8px;align-items:center;font-size:14px}
.winner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,10,24,.8);z-index:20;padding:20px}
.winner[hidden]{display:none}
.wc{background:var(--panel);border-radius:24px;padding:clamp(24px,5vw,60px);text-align:center;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.wc small{display:block;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;margin-bottom:10px}
.wc .nm{font-weight:800;font-size:clamp(36px,8vw,100px);line-height:1.05;color:var(--accent);overflow-wrap:anywhere}
@media (max-width:1000px){body{grid-template-columns:1fr;height:auto}.wheelbox{width:min(100%,520px)}}
</style>
</head>
<body>

<div class="col">
  <div class="card">
    <h1><small>9ª Semana de Biotecnologia</small>Sorteio de brindes</h1>
  </div>
  <div class="card">
    <div class="big">Aponte a câmera e concorra!</div>
    <p class="muted">Escaneie, preencha o nome e fique de olho no telão.</p>
    <div class="qr" id="qr"></div>
  </div>
  <div class="card">
    <div class="muted">Concorrendo</div>
    <div class="n" id="n">0</div>
    <div class="status" id="st">Conectando…</div>
  </div>
</div>

<div class="col center">
  <div class="wheelbox"><canvas id="cv" width="1200" height="1200"></canvas><div class="pointer"></div></div>
  <div class="now" id="now">&nbsp;</div>
  <div class="row"><button class="go" id="spin">Girar</button></div>
</div>

<div class="col">
  <div class="card list">
    <h2>Quem está concorrendo</h2>
    <ol id="cur"></ol>
  </div>
  <div class="card" style="max-height:38vh;overflow:auto">
    <h2>Já sorteados</h2>
    <ol id="hist"></ol>
    <div class="row" style="justify-content:flex-start;margin-top:10px"><button id="clearh">Zerar sorteados</button><button id="clearall">Apagar todos os nomes</button></div>
  </div>
</div>

<div class="winner" id="win" hidden>
  <div class="wc"><small>Sorteado(a)</small><div class="nm" id="wname"></div>
    <div class="row" style="margin-top:24px"><button class="go" id="ok" style="font-size:18px;padding:10px 28px">Continuar</button></div></div>
</div>

<script>
(function(){
  var DB='https://sdb-sorteio-default-rtdb.firebaseio.com';
  var REFRESH_MS=2000;
  var JOIN_URL=new URL('entrar.html',location.href).href;

  var $=function(i){return document.getElementById(i)};
  try{new QRCode($('qr'),{text:JOIN_URL,width:240,height:240,colorDark:'#0f2a52',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){$('qr').textContent='QR indisponível (sem internet?)'}

  var cv=$('cv'),ctx=cv.getContext('2d'),W=1200,C=W/2,R=C-14;
  var COLORS=['#1f5fd1','#6fb1ff','#0f2a52','#3a86e8','#a9d2ff','#164a9e'];
  var LIGHT={'#6fb1ff':1,'#a9d2ff':1};
  var all=[],names=[],hist=[],rot=0,spinning=false;
  try{hist=JSON.parse(localStorage.getItem('sdb_hist')||'[]')}catch(e){}
  function saveH(){try{localStorage.setItem('sdb_hist',JSON.stringify(hist))}catch(e){}}

  function parseCSV(t){
    var rows=[],r=[],f='',q=false;
    for(var i=0;i<t.length;i++){var c=t[i];
      if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
      else if(c=='"')q=true;
      else if(c==','){r.push(f);f=''}
      else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}
      else f+=c}
    if(f||r.length){r.push(f);rows.push(r)}
    return rows;
  }
  function build(){
    var won={};hist.forEach(function(h){won[h.toLowerCase()]=1});
    var seen={};names=[];
    all.forEach(function(n){var k=n.toLowerCase();if(seen[k])return;seen[k]=1;if(!won[k])names.push(n)});
    $('n').textContent=names.length;
    var ol=$('cur');ol.innerHTML='';names.slice().reverse().forEach(function(n){var li=document.createElement('li');li.textContent=n;ol.appendChild(li)});
    var oh=$('hist');oh.innerHTML='';hist.forEach(function(n){var li=document.createElement('li');li.textContent=n;oh.appendChild(li)});
    $('spin').disabled=spinning||names.length<1;
    if(!spinning)draw();
  }
  function pull(){
    fetch(DB+'/names.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
      var arr=[];if(d)Object.keys(d).forEach(function(k){var v=d[k];if(v&&v.name)arr.push({n:String(v.name).replace(/\s+/g,' ').trim(),t:v.t||0})});
      arr.sort(function(x,y){return x.t-y.t});
      all=arr.map(function(x){return x.n}).filter(Boolean);
      if(!spinning)build();
      $('st').className='status';$('st').textContent='Ao vivo · atualizado às '+new Date().toLocaleTimeString('pt-BR');
    }).catch(function(){$('st').className='status err';$('st').textContent='Sem conexão com o banco. Tentando de novo…'});
  }

  function fit(t,max){
    ctx.font='800 '+Math.min(46,Math.max(18,max*0.55))+'px "Plus Jakarta Sans",system-ui,sans-serif';
    var s=t;while(ctx.measureText(s).width>R*0.62&&s.length>3)s=s.slice(0,-2);
    return s.length<t.length?s.trim()+'…':s;
  }
  function draw(){
    ctx.clearRect(0,0,W,W);var n=names.length;
    if(n===0){
      ctx.beginPath();ctx.arc(C,C,R,0,7);ctx.fillStyle='#a9d2ff';ctx.fill();
      ctx.fillStyle='#0f2a52';ctx.textAlign='center';ctx.font='800 46px "Plus Jakarta Sans",system-ui,sans-serif';
      ctx.fillText('Aguardando nomes',C,C-6);ctx.font='500 32px "Plus Jakarta Sans",system-ui,sans-serif';ctx.fillText('Escaneie o QR code',C,C+40);return;
    }
    var a=2*Math.PI/n;
    function col(i){var c=COLORS[i%COLORS.length];if(n>1&&i===n-1&&i%COLORS.length===0)c=COLORS[1];return c}
    for(var i=0;i<n;i++){var s=rot+i*a;ctx.beginPath();ctx.moveTo(C,C);ctx.arc(C,C,R,s,s+a);ctx.closePath();ctx.fillStyle=col(i);ctx.fill();
      if(n<=150){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=n>60?1:2;ctx.stroke()}}
    if(n<=48){for(var j=0;j<n;j++){var c=col(j);ctx.save();ctx.translate(C,C);ctx.rotate(rot+(j+.5)*a);ctx.textAlign='right';ctx.textBaseline='middle';
      ctx.fillStyle=LIGHT[c]?'#0f2a52':'#ffffff';ctx.fillText(fit(names[j],R*a),R-26,0);ctx.restore()}}
    ctx.beginPath();ctx.arc(C,C,R,0,7);ctx.lineWidth=10;ctx.strokeStyle='#ffffff';ctx.stroke();
    ctx.beginPath();ctx.arc(C,C,46,0,7);ctx.fillStyle='#ffffff';ctx.fill();ctx.lineWidth=8;ctx.strokeStyle='#0f2a52';ctx.stroke();
  }
  function under(){var n=names.length;if(!n)return -1;var a=2*Math.PI/n;var x=(-Math.PI/2-rot)%(2*Math.PI);if(x<0)x+=2*Math.PI;return Math.min(n-1,Math.floor(x/a))}
  function ease(t){return 1-Math.pow(1-t,4)}
  function spin(){
    if(spinning||!names.length)return;spinning=true;$('spin').disabled=true;
    var snap=names.slice(),n=snap.length,a=2*Math.PI/n,w=Math.floor(Math.random()*n);
    var target=-Math.PI/2-(w+.5)*a+(Math.random()-.5)*a*.7,start=rot,tp=2*Math.PI;
    while(target<start+tp*7)target+=tp;
    var dur=7000,t0=performance.now();
    (function step(now){
      var p=Math.min(1,(now-t0)/dur);rot=start+(target-start)*ease(p);draw();
      var u=under();if(u>=0)$('now').textContent=names[u];
      if(p<1)requestAnimationFrame(step);else{
        var name=names[w];window._last=name;$('wname').textContent=name;$('win').hidden=false;$('ok').focus();$('now').innerHTML='&nbsp;';
      }
    })(t0);
  }
  $('ok').onclick=function(){
    $('win').hidden=true;spinning=false;
    if(window._last){hist.push(window._last);window._last=null;saveH()}
    build();
  };
  $('spin').onclick=spin;
  var armed=null;
  $('clearall').onclick=function(){
    var b=$('clearall');
    if(!armed){b.textContent='Clique de novo para confirmar';armed=setTimeout(function(){armed=null;b.textContent='Apagar todos os nomes'},4000);return}
    clearTimeout(armed);armed=null;b.textContent='Apagando…';
    fetch(DB+'/names.json',{method:'DELETE'}).then(function(r){if(!r.ok)throw 0;hist=[];saveH();all=[];build();b.textContent='Nomes apagados'}).catch(function(){b.textContent='Erro ao apagar'})
    .then(function(){setTimeout(function(){b.textContent='Apagar todos os nomes'},2500)});
  };
  $('clearh').onclick=function(){hist=[];saveH();build()};
  document.addEventListener('keydown',function(e){
    if(!$('win').hidden){if(e.key==='Enter')$('ok').click();return}
    if(e.code==='Space'||e.key==='Enter'){e.preventDefault();spin()}
  });
  build();pull();setInterval(pull,REFRESH_MS);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
